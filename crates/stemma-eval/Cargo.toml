[package]
name = "stemma-eval"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
rand = "0.9"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlparser = { version = "0.62.0", features = ["visitor"] }
stemma-embed = { path = "../stemma-embed" }
stemma-ingest = { path = "../stemma-ingest" }
stemma-kg = { path = "../stemma-kg" }
stemma-lm = { path = "../stemma-lm" }
stemma-resolve = { path = "../stemma-resolve" }
stemmadb = { path = "../stemmadb" }
tracing = "0.1"
