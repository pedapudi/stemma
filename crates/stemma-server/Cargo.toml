[package]
name = "stemma-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stemma-embed = { version = "0.1.0", path = "../stemma-embed" }
stemma-ingest = { version = "0.1.0", path = "../stemma-ingest" }
stemma-kg = { version = "0.1.0", path = "../stemma-kg" }
stemma-lm = { version = "0.1.0", path = "../stemma-lm" }
stemma-parse = { version = "0.1.0", path = "../stemma-parse" }
stemma-proto = { version = "0.1.0", path = "../stemma-proto" }
stemma-resolve = { version = "0.1.0", path = "../stemma-resolve" }
stemmadb = { version = "0.1.0", path = "../stemmadb" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
