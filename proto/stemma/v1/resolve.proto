// stemma Resolve API: pin natural-language mentions to concrete records.
//
// Resolve preserves candidate evidence and reports whether grounding is
// settled. Parse proceeds only from a settled trace.
syntax = "proto3";

package stemma.v1;

service ResolveService {
  // Resolve the entity mentions in a natural-language query against the
  // database identified by `database`.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);

  // Like Resolve, but returns the full resolution trajectory: every span
  // considered, every candidate from every channel with its scores, and the
  // reason each near-miss was not selected. The analogue of SQL EXPLAIN;
  // drives the UI's query-plan view.
  rpc Explain(ResolveRequest) returns (ExplainResponse);

  // Resolve the query and propose a validated, parameterized read-only query.
  rpc Parse(ParseRequest) returns (ParseResponse);

  // Record an explicit judgment about one exact resolution or parse episode.
  rpc SubmitFeedback(FeedbackRequest) returns (Feedback);

  // Retrieve explicit judgments for inspection or deletion.
  rpc ListFeedback(ListFeedbackRequest) returns (FeedbackList);

  // Permanently remove one explicit judgment.
  rpc DeleteFeedback(DeleteFeedbackRequest) returns (DeleteFeedbackResponse);
}

// ---------- Explain (full trajectory) ----------

message ExplainResponse {
  string query = 1;
  double elapsed_ms = 2;
  repeated TraceToken tokens = 3;
  // Every span enumerated, including skipped/rejected ones.
  repeated TraceSpan spans = 4;
  // Indices into `spans` of the spans selected as mentions, in query order.
  repeated uint32 mentions = 5;
  // Query-level resolution derived from the selected mentions.
  ResolutionOutcome outcome = 6;
  // The best deterministic question, when the outcome is ambiguous.
  Clarification clarification = 7;
  // Opaque identity used to attach explicit feedback to this trajectory.
  string episode_id = 8;
}

enum ResolutionStatus {
  RESOLUTION_STATUS_UNSPECIFIED = 0;
  RESOLUTION_STATUS_RESOLVED = 1;
  RESOLUTION_STATUS_EQUIVALENT = 2;
  RESOLUTION_STATUS_AMBIGUOUS = 3;
  RESOLUTION_STATUS_UNKNOWN = 4;
  RESOLUTION_STATUS_UNANSWERABLE = 5;
}

message ResolutionOutcome {
  ResolutionStatus status = 1;
  // Span ids requiring clarification. Empty unless status is AMBIGUOUS.
  repeated uint32 ambiguous_spans = 2;
  // Stable, machine-readable explanation of the status.
  string reason = 3;
}

message Clarification {
  uint32 span_id = 1;
  string dimension = 2;
  string question = 3;
  repeated ClarificationOption options = 4;
}

message ClarificationOption {
  string label = 1;
  // Indices into the owning span's candidates.
  repeated uint32 candidate_indices = 2;
}

message TraceToken {
  string text = 1;
  // Byte offsets into `query`, end-exclusive.
  uint32 start = 2;
  uint32 end = 3;
  bool stopword = 4;
}

message TraceChannelScore {
  // "exact" | "bm25" | "trigram"
  string channel = 1;
  // Rank within this channel's results for the span (0 = best).
  uint32 rank = 2;
  // Channel-native score, larger = better.
  double raw = 3;
}

message TraceCandidate {
  string table = 1;
  string column = 2;
  int64 rowid = 3;
  // Stored value (possibly truncated for transport).
  string value = 4;
  bool value_truncated = 5;
  // Fused score in [0, 1].
  double score = 6;
  bool selected = 7;
  // Why an unselected candidate lost: "below_threshold" | "outranked" |
  // "span_not_selected". Empty for selected candidates.
  string reject_reason = 8;
  repeated TraceChannelScore channels = 9;
  // For document-shaped values: a match snippet with ⟨⟩ marking hit terms.
  string snippet = 10;
  bool is_doc = 11;
  // True when the LM adjudication band chose this candidate; the choice is
  // applied as a reorder, so an adjudicated candidate sits at the front.
  bool adjudicated = 12;
  // Instance-level connection to a co-mention's candidate, verified in the
  // user database during collective disambiguation — a human-readable path
  // like "people #2 ←lead_id— teams #43". Empty when no such evidence.
  string coherence = 13;
  // For value candidates: how many user rows share this interpretation
  // (table, column, normalized value). `rowid` is a representative of the
  // set. 1 for document candidates, which keep per-row identity.
  uint32 row_count = 14;
  // Up to three concrete rowids carrying the interpretation, ascending;
  // the first is the representative `rowid`.
  repeated int64 sample_rowids = 15;
  // Exact count of grain-table rows this reading reaches through the schema.
  // `row_count` counts the cells holding the value; `reach` counts the facts
  // they account for — what a query over this reading would aggregate.
  // 0 when not computed (only ambiguous mentions are measured).
  uint64 reach = 16;
}

message TraceSpan {
  uint32 id = 1;
  string text = 2;
  uint32 start = 3;
  uint32 end = 4;
  // "selected" | "overlapped" | "no_candidates" | "weak" | "skipped"
  string status = 5;
  repeated TraceCandidate candidates = 6;
  // The span's text matches a knowledge-graph phrase/term entity — mention
  // detection used the KG, and selection favored this span.
  bool kg_alias = 7;
  // The escalation (context coherence, encoder affinity, adjudication)
  // ended with distinct readings still tied: the honest resolution is a
  // question, and consumers should ask rather than pick.
  bool ambiguous = 8;
  // max(reach)/min(reach) over the readings still tied for the mention: how
  // far apart they are in what they would return. `ambiguous` says the
  // readings are tied; this says whether the tie is worth interrupting a
  // human over. 1.0 means the choice barely moves the answer; 100.0 means two
  // orders of magnitude. 0.0 when not computed.
  double divergence = 9;
  // Which rule, other than the fused-score threshold, admitted this span
  // into the trace's mentions. Empty for ordinary selection.
  // "dense_geometry": the span's only evidence is dense and its calibrated
  // confidence sits above the corpus's null-pair mean — a nomination
  // (status stays "weak", no selected candidates), not a confident mention;
  // it is excluded from ResolveResponse.mentions.
  string admitted_by = 10;
}

message ResolveRequest {
  // The natural-language question, verbatim.
  string query = 1;
  // Logical name of the target database (registered with the server).
  string database = 2;
  ResolveOptions options = 3;
}

message ResolveOptions {
  // Maximum ranked candidates returned per mention (0 = server default).
  uint32 max_candidates_per_mention = 1;
  // Permit the LM band (mention expansion, adjudication). Off = pure
  // lexical/dense/KG pipeline.
  bool allow_lm = 2;
  // Drop candidates below this confidence (0 = server default).
  double min_confidence = 3;
  // Where the query came from ("console", "agent", "mcp", ...). Recorded in
  // the store's query history.
  string source = 4;
  // Session/conversation identifier for history tagging (e.g. an agent
  // session id). Empty for one-off queries.
  string session = 5;
}

message ResolveResponse {
  // Detected mentions with their ranked candidate resolutions.
  repeated Mention mentions = 1;
  ResolutionOutcome outcome = 2;
  Clarification clarification = 3;
  // Opaque identity used to attach explicit feedback to this resolution.
  string episode_id = 4;
}

// ---------- Feedback (explicit user judgment) ----------

enum FeedbackCategory {
  FEEDBACK_CATEGORY_UNSPECIFIED = 0;
  FEEDBACK_CATEGORY_APPROVED = 1;
  FEEDBACK_CATEGORY_REJECTED = 2;
  FEEDBACK_CATEGORY_WRONG_MEANING = 3;
  FEEDBACK_CATEGORY_MISSING_INTERPRETATION = 4;
  FEEDBACK_CATEGORY_WRONG_QUERY_OPERATION = 5;
  FEEDBACK_CATEGORY_WRONG_ROWS = 6;
}

enum FeedbackScope {
  FEEDBACK_SCOPE_UNSPECIFIED = 0;
  FEEDBACK_SCOPE_SESSION = 1;
  FEEDBACK_SCOPE_DATABASE = 2;
}

message FeedbackRequest {
  string database = 1;
  string episode_id = 2;
  FeedbackCategory category = 3;
  FeedbackScope scope = 4;
  optional uint32 span_id = 5;
  // Candidate position within the recorded span, when the user selects a
  // concrete reading.
  optional uint32 candidate_index = 6;
  // Option position within the recorded clarification question.
  optional uint32 clarification_option = 7;
  // User-supplied meaning or correction when the offered choices are wrong.
  string correction = 8;
}

message Feedback {
  uint64 id = 1;
  string episode_id = 2;
  FeedbackCategory category = 3;
  FeedbackScope scope = 4;
  optional uint32 span_id = 5;
  optional uint32 candidate_index = 6;
  optional uint32 clarification_option = 7;
  string correction = 8;
  string recorded_at = 9;
}

message ListFeedbackRequest {
  string database = 1;
  optional string episode_id = 2;
}

message FeedbackList {
  repeated Feedback feedback = 1;
}

message DeleteFeedbackRequest {
  string database = 1;
  uint64 feedback_id = 2;
}

message DeleteFeedbackResponse {
  bool deleted = 1;
}

// A span of the query believed to reference something in the database.
message Mention {
  // Surface text of the span.
  string text = 1;
  // Byte offsets into ResolveRequest.query (start inclusive, end exclusive).
  uint32 start = 2;
  uint32 end = 3;
  // Ranked candidate resolutions, best first.
  repeated Candidate candidates = 4;
  // True when the pipeline affirmatively concluded no record matches
  // (distinct from "no candidates found").
  bool nil = 5;
}

// ---------- Parse (validated query) ----------

message ParseRequest {
  string query = 1;
  string database = 2;
  ResolveOptions options = 3;
}

enum ParseStatus {
  PARSE_STATUS_UNSPECIFIED = 0;
  PARSE_STATUS_RESOLVED = 1;
  PARSE_STATUS_AMBIGUOUS = 2;
  PARSE_STATUS_UNKNOWN = 3;
  PARSE_STATUS_UNANSWERABLE = 4;
  PARSE_STATUS_PROPOSAL_UNAVAILABLE = 5;
  PARSE_STATUS_INVALID_PROPOSAL = 6;
}

message ParseResponse {
  ParseStatus status = 1;
  ResolveResponse resolution = 2;
  string sql = 3;
  repeated QueryParameter parameters = 4;
  repeated GroundingUse grounding_uses = 5;
  repeated string assumptions = 6;
  repeated ValidationFailure validation_failures = 7;
  // Reserved for a future parse-structure clarification; grounding questions
  // remain in `resolution`.
  Clarification clarification = 8;
}

message QueryParameter {
  uint32 position = 1;
  oneof value {
    int64 integer = 2;
    double real = 3;
    string text = 4;
    bytes blob = 5;
    bool boolean = 6;
    bool null = 7;
  }
}

message GroundingUse {
  string kind = 1;
  string name = 2;
  optional uint32 span_id = 3;
  optional uint32 candidate_index = 4;
}

message ValidationFailure {
  string code = 1;
  string message = 2;
  string location = 3;
}

// One concrete record (or schema element) a mention may resolve to.
message Candidate {
  // Table holding the record.
  string table = 1;
  // SQLite rowid of the record (0 when the candidate is a schema element).
  int64 rowid = 2;
  // Column whose value matched, when the link is value-level.
  string column = 3;
  // The canonical stored value that matched.
  string value = 4;
  // Heuristic fused ranking score in [0, 1].
  double score = 5;
  repeated Evidence evidence = 6;
  // For document-shaped values: a match snippet with ⟨⟩ marking hit terms.
  string snippet = 7;
  // True when the stored value is a document the mention resolves into,
  // rather than a value it equals.
  bool is_doc = 8;
}

// Why a candidate is believed; every candidate carries at least one.
message Evidence {
  oneof kind {
    LexicalMatch lexical = 1;
    SemanticMatch semantic = 2;
    KgPath kg_path = 3;
    ProbeResult probe = 4;
    Adjudication adjudication = 5;
  }
}

message LexicalMatch {
  // Retrieval channel: "exact", "bm25", "trigram", or "spellfix".
  string channel = 1;
  // The stored text the mention matched against (an alias, a cell value).
  string matched_text = 2;
  // Channel-native score (BM25 score, edit distance, ...).
  double score = 3;
}

message SemanticMatch {
  // Embedding model identity, as recorded in the stemmadb model registry.
  string model = 1;
  double similarity = 2;
}

// A path through the knowledge graph connecting this candidate to another
// resolved mention's candidate — the collective-disambiguation evidence.
message KgPath {
  // Node labels along the path, e.g. ["person:17 'W. Chen'", "team:42"].
  repeated string nodes = 1;
  // Edge labels between consecutive nodes, e.g. ["manages"].
  repeated string edges = 2;
}

// A live verification query run against the user database.
message ProbeResult {
  string sql = 1;
  uint64 row_count = 2;
}

// An LM select-among-k decision (only present when the LM band ran).
message Adjudication {
  string model = 1;
  string rationale = 2;
}
