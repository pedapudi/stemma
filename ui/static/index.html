<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stemma console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui.css">
</head>
<body>
  <header class="topbar">
    <span class="brand" id="brand">
      <!-- the stemma mark: witnesses converging on the one lost archetype;
           strokes follow the ink, the dot is the referent — the only color -->
      <svg width="26" height="26" viewBox="0 0 24 24" role="img" aria-label="stemma">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20 C4 13 9 12 12 8"/>
          <path d="M12 20 C12 15 12 12 12 8"/>
          <path d="M20 20 C20 13 15 12 12 8"/>
          <path d="M7.5 15.5 L9.2 17.2"/>
          <path d="M16.5 15.5 L14.8 17.2"/>
        </g>
        <circle cx="12" cy="5.6" r="2.1" fill="var(--brand-accent)"/>
      </svg>
      <span class="brand-word">stemmadb</span>
      <span class="brand-variant">console</span>
      <span class="respreview">research<br>preview</span>
    </span>
    <span class="crumbs" id="crumbs"></span>
    <span class="spacer"></span>
    <nav class="nav" id="nav">
      <a href="#/resolve" data-view="resolve">⌕ resolve</a>
      <a href="#/data" data-view="data">▤ data</a>
      <a href="#/graph" data-view="graph">⬡ graph</a>
      <a href="#/store" data-view="store">▦ store</a>
      <a href="#/sql" data-view="sql">› sql</a>
    </nav>
    <input class="input topsearch" id="topsearch" placeholder="resolve a query…" aria-label="resolve a query">
    <span class="swatchbox">
      <button class="btn" id="themebtn" aria-label="theme">◧</button>
      <div class="swatches" id="swatches" role="menu"></div>
    </span>
    <span class="status" id="status"><span class="dot"></span><span id="statusword">connecting</span></span>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="viewhost" id="view"></main>
  </div>

  <div class="hovercard" id="hovercard"></div>
  <script src="/static/ui.js"></script>
</body>
</html>
