<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stemma console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Google+Sans+Mono:wght@400;500;700&family=Noto+Sans+Mono:wght@400;500;700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600;700&family=Inconsolata:wght@400;500;700&family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Bitter:wght@400;500;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,700&family=Domine:wght@400;500;700&family=Archivo+Narrow:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Hanken+Grotesk:wght@400;500;700&family=Barlow+Condensed:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/ui.css?v=3655174413">
</head>
<body>
  <header class="topbar">
    <span class="brand" id="brand">
      <!-- the stemma mark: witnesses converging on the one lost archetype;
           strokes follow the ink, the dot is the referent — the only color -->
      <svg width="26" height="26" viewBox="0 0 24 24" role="img" aria-label="stemma">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20 C4 13 9 12 12 8"/>
          <path d="M12 20 C12 15 12 12 12 8"/>
          <path d="M20 20 C20 13 15 12 12 8"/>
          <path d="M7.5 15.5 L9.2 17.2"/>
          <path d="M16.5 15.5 L14.8 17.2"/>
        </g>
        <circle cx="12" cy="5.6" r="2.1" fill="var(--brand-accent)"/>
      </svg>
      <span class="brand-word">stemma<span class="brand-dot">·</span>db</span>
      <span class="brand-variant">console</span>
      <span class="respreview">research<br>preview</span>
    </span>
    <span class="crumbs" id="crumbs"></span>
    <span class="spacer"></span>
    <input class="input topsearch" id="topsearch" placeholder="ask about the data…" aria-label="ask about the data">
    <span class="spacer"></span>
    <nav class="nav" id="nav">
      <a href="#/query" data-view="query">⌕ query</a>
      <a href="#/data" data-view="data">▤ data</a>
      <a href="#/graph" data-view="graph">⬡ graph</a>
    </nav>
    <button class="btn" id="chattoggle" aria-label="toggle chat rail">◍ chat</button>
    <span id="typepicker"></span>
    <span id="themepicker"></span>
    <span class="status" id="status"><span class="dot"></span><span id="statusword">connecting</span></span>
  </header>

  <div class="body" id="bodygrid">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="viewhost" id="view"></main>
    <aside class="chatrail" id="chatrail" hidden></aside>
  </div>

  <div class="hovercard" id="hovercard"></div>
  <script src="/static/ui.js?v=3655174413"></script>
</body>
</html>
