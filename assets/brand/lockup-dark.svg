<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 24" width="152" height="24"
     role="img" aria-label="stemmadb" color="#F2EEDE">
  <title>stemmadb</title>
  <!-- mark + display wordmark (stemma·db), horizontal. the gap is 9 units — a
       third of the mark's width. ink is currentColor; the archetype dot and
       its echo in the interpunct are the only colored elements. -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20 C4 13 9 12 12 8"/>
    <path d="M12 20 C12 15 12 12 12 8"/>
    <path d="M20 20 C20 13 15 12 12 8"/>
    <path d="M7.5 15.5 L9.2 17.2"/>
    <path d="M16.5 15.5 L14.8 17.2"/>
  </g>
  <circle cx="12" cy="5.6" r="2.1" fill="var(--brand-accent, #3FB87A)"/>
  <text x="33" y="17" fill="currentColor"
        font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-weight="700" font-size="14" letter-spacing="0.14">stemma<tspan fill="var(--brand-accent, #3FB87A)">·</tspan>db</text>
</svg>
