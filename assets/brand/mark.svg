<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     role="img" aria-label="stemma" color="#15181C">
  <title>stemma</title>
  <!-- witness branches fanning from one stem, converging on the lost archetype.
       strokes follow currentColor; the dot is the referent — the only color.
       the color="" above is a FALLBACK for <img> use on light grounds; a host
       that inlines this mark should drop it (or set `svg { color: inherit }`). -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20 C4 13 9 12 12 8"/>
    <path d="M12 20 C12 15 12 12 12 8"/>
    <path d="M20 20 C20 13 15 12 12 8"/>
    <path d="M7.5 15.5 L9.2 17.2"/>
    <path d="M16.5 15.5 L14.8 17.2"/>
  </g>
  <circle cx="12" cy="5.6" r="2.1" fill="var(--brand-accent, #2FA46A)"/>
</svg>
