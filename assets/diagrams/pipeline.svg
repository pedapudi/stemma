<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 700" width="1580" height="700"
     class="dg" role="img" aria-label="stemma resolution pipeline">
  <title>stemma — resolution pipeline</title>
  <style>
    .dg { color:#15181C; }
    @media (prefers-color-scheme: dark) { .dg { color:#EDEFEA; } }
    .dg .dot { fill:#2FA46A; }
    @media (prefers-color-scheme: dark) { .dg .dot { fill:#3FB87A; } }
    text { font-family:"JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; fill:currentColor; }
    .t  { font-size:14px; font-weight:700; }
    .bt { font-size:11px; font-weight:700; }
    .n  { font-size:9.5px; }
    .s  { font-size:8.5px; }
    .m  { opacity:0.62; }
    .f  { opacity:0.38; }
    .box  { fill:none; stroke:currentColor; stroke-width:1.4; stroke-linejoin:round; }
    .sub  { fill:none; stroke:currentColor; stroke-width:1.2; opacity:0.7; }
    .file { fill:none; stroke:currentColor; stroke-width:1.2; stroke-linejoin:round; }
    .edge { fill:none; stroke:currentColor; stroke-width:1.2; }
    .fedge{ fill:none; stroke:currentColor; stroke-width:1.1; opacity:0.4; }
    .designed { stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M1.5 1 L6.5 4 L1.5 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </marker>
  </defs>

  <text x="40" y="42" class="t">stemma — resolution pipeline</text>
  <text x="40" y="62" class="s m">crates/stemma-resolve · one call = one Trace · every stage keeps its rejects</text>
  <g>
    <rect x="700" y="28" width="24" height="14" rx="4" class="box designed" stroke-width="1.2"/>
    <text x="734" y="39" class="s m">designed, not built</text>
    <path d="M900 35 H926" class="fedge"/>
    <text x="936" y="39" class="s m">store table read</text>
  </g>

  <!-- query_log side note -->
  <text x="1250" y="106" class="s f">server appends query_log after</text>
  <text x="1250" y="118" class="s f">each resolve (q · mentions · ms)</text>
  <path d="M1516 152 V126 H1430" class="fedge"/>

  <!-- query in -->
  <text x="40" y="222" class="n m">query</text>
  <path d="M40 232 H74" class="edge" marker-end="url(#a)"/>

  <!-- 1 tokenize -->
  <rect x="80" y="180" width="140" height="110" rx="7" class="box"/>
  <text x="92" y="202" class="bt">tokenize</text>
  <text x="92" y="222" class="s m">alphanumeric runs</text>
  <text x="92" y="236" class="s m">byte offsets kept</text>
  <text x="92" y="254" class="s m">stopwords flagged,</text>
  <text x="92" y="266" class="s m">not dropped</text>
  <path d="M220 232 H250" class="edge" marker-end="url(#a)"/>

  <!-- 2 span enumeration -->
  <rect x="256" y="168" width="152" height="134" rx="7" class="box"/>
  <text x="268" y="190" class="bt">enumerate spans</text>
  <text x="268" y="210" class="s m">all n-grams, 1..4 tokens</text>
  <text x="268" y="224" class="s m">&lt;3 chars or stopword-</text>
  <text x="268" y="236" class="s m">only &#8594; "skipped"</text>
  <text x="268" y="256" class="s">+ whole-query span</text>
  <text x="268" y="270" class="s m">embedder present and</text>
  <text x="268" y="282" class="s m">&gt;4 tokens</text>
  <path d="M408 232 H438" class="edge" marker-end="url(#a)"/>

  <!-- 3 kg mention detection -->
  <rect x="444" y="174" width="150" height="122" rx="7" class="box"/>
  <text x="456" y="196" class="bt">kg mentions</text>
  <text x="456" y="216" class="s m">span text = compiled</text>
  <text x="456" y="228" class="s m">term/phrase entity?</text>
  <text x="456" y="246" class="s m">&#8594; kg_alias flag,</text>
  <text x="456" y="258" class="s m">favored in selection</text>
  <path d="M594 232 H624" class="edge" marker-end="url(#a)"/>

  <!-- 4 channels -->
  <rect x="630" y="130" width="200" height="280" rx="7" class="box"/>
  <text x="642" y="152" class="bt">candidate channels</text>
  <text x="642" y="166" class="s m">per live span · limit 8 each</text>
  <rect x="642" y="176" width="176" height="38" rx="4" class="sub"/>
  <text x="652" y="192" class="n">exact</text>
  <text x="652" y="206" class="s m">value_norm · len&#8804;120 · 1.0</text>
  <rect x="642" y="220" width="176" height="38" rx="4" class="sub"/>
  <text x="652" y="236" class="n">bm25</text>
  <text x="652" y="250" class="s m">lex_fts · unicode61</text>
  <rect x="642" y="264" width="176" height="38" rx="4" class="sub"/>
  <text x="652" y="280" class="n">trigram</text>
  <text x="652" y="294" class="s m">lex_trigram · fuzzy/substr</text>
  <rect x="642" y="308" width="176" height="62" rx="4" class="sub"/>
  <text x="652" y="324" class="n">dense · targeted</text>
  <text x="652" y="338" class="s m">&#8804;4 spans w/o exact hit,</text>
  <text x="652" y="350" class="s m">longest first · knn k=8</text>
  <text x="652" y="362" class="s m">one batched embed call</text>
  <text x="642" y="390" class="s f">embedder absent or down</text>
  <text x="642" y="402" class="s f">&#8594; lexical + kg only</text>
  <path d="M830 232 H860" class="edge" marker-end="url(#a)"/>

  <!-- 5 rrf fusion -->
  <rect x="866" y="150" width="180" height="196" rx="7" class="box"/>
  <text x="878" y="172" class="bt">fuse · rrf</text>
  <text x="878" y="192" class="s m">score = &#931; 1/(K+rank),</text>
  <text x="878" y="204" class="s m">RRF_K=4 · norm by 3/K</text>
  <text x="878" y="222" class="s m">exact &#8594; [0.9, 1.0]</text>
  <text x="878" y="236" class="s m">doc &#8594; base &#215; 0.85 cap</text>
  <text x="878" y="250" class="s m">value &#8594; &#215;(0.4+0.6&#183;affinity)</text>
  <text x="878" y="272" class="s">calibrated cosine floor</text>
  <text x="878" y="286" class="s m">score &#8805; ((cos&#8722;0.30)/0.30)</text>
  <text x="878" y="298" class="s m">&#215; 0.78</text>
  <text x="878" y="318" class="s f">dense cosine is absolute</text>
  <text x="878" y="330" class="s f">evidence, not just a rank</text>
  <path d="M1046 232 H1076" class="edge" marker-end="url(#a)"/>

  <!-- 6 kg coherence -->
  <rect x="1082" y="164" width="160" height="140" rx="7" class="box"/>
  <text x="1094" y="186" class="bt">kg coherence</text>
  <text x="1094" y="206" class="s m">doc candidates only</text>
  <text x="1094" y="220" class="s m">co-terms via cooccurs</text>
  <text x="1094" y="232" class="s m">edges, &#8804;4</text>
  <text x="1094" y="250" class="s m">one lex_fts probe</text>
  <text x="1094" y="262" class="s m">per co-term</text>
  <text x="1094" y="280" class="s m">+0.04&#183;m · cap 0.9 ·</text>
  <text x="1094" y="292" class="s m">"kg" channel in trace</text>
  <path d="M1242 232 H1272" class="edge" marker-end="url(#a)"/>

  <!-- 7 greedy selection -->
  <rect x="1278" y="158" width="160" height="152" rx="7" class="box"/>
  <text x="1290" y="180" class="bt">greedy select</text>
  <text x="1290" y="200" class="s m">non-overlapping byte</text>
  <text x="1290" y="212" class="s m">ranges, strongest first</text>
  <text x="1290" y="230" class="s m">kg_alias &#215;1.08 nudge</text>
  <text x="1290" y="244" class="s m">threshold 0.35 · top-k 5</text>
  <text x="1290" y="262" class="s m">losers stay in trace:</text>
  <text x="1290" y="274" class="s m">overlapped · weak ·</text>
  <text x="1290" y="286" class="s m">below_threshold</text>
  <path d="M1438 232 H1454" class="edge" marker-end="url(#a)"/>

  <!-- 8 adjudication band (designed) -->
  <rect x="1178" y="420" width="260" height="118" rx="7" class="box designed"/>
  <text x="1190" y="442" class="bt">lm adjudication band</text>
  <text x="1364" y="442" class="s m">designed</text>
  <text x="1190" y="462" class="s m">ambiguous band only · lm selects</text>
  <text x="1190" y="474" class="s m">among k presented candidates</text>
  <text x="1190" y="492" class="s m">choice or explicit NIL · decision</text>
  <text x="1190" y="504" class="s m">recorded as Adjudication evidence</text>
  <text x="1190" y="522" class="s m">gate: allow_lm (accepted, ignored)</text>
  <path d="M1330 310 V414" class="edge designed" marker-end="url(#a)"/>
  <path d="M1438 470 H1516 V330" class="edge designed" marker-end="url(#a)"/>

  <!-- 9 trace out -->
  <rect x="1460" y="158" width="112" height="166" rx="7" class="box"/>
  <circle cx="1548" cy="176" r="3" class="dot"/>
  <text x="1472" y="182" class="bt">Trace</text>
  <text x="1472" y="202" class="s m">every span,</text>
  <text x="1472" y="214" class="s m">candidate,</text>
  <text x="1472" y="226" class="s m">channel score,</text>
  <text x="1472" y="238" class="s m">reject reason</text>
  <text x="1472" y="258" class="s">Resolve &#8594;</text>
  <text x="1472" y="270" class="s m">selected only</text>
  <text x="1472" y="288" class="s">Explain &#8594;</text>
  <text x="1472" y="300" class="s m">full trajectory</text>

  <!-- store substrate -->
  <rect x="330" y="470" width="740" height="150" rx="10" class="fedge"/>
  <text x="346" y="492" class="s m">user.stemmadb · read-only for the pipeline</text>
  <path d="M350 520 L442 520 L452 530 L452 566 L350 566 Z M442 520 L442 530 L452 530" class="file"/>
  <text x="360" y="540" class="n">kg_nodes</text>
  <text x="360" y="556" class="s m">terms · phrases</text>
  <path d="M480 520 L572 520 L582 530 L582 566 L480 566 Z M572 520 L572 530 L582 530" class="file"/>
  <text x="490" y="540" class="n">lex_values</text>
  <text x="490" y="556" class="s m">norm + is_doc</text>
  <path d="M610 520 L688 520 L698 530 L698 566 L610 566 Z M688 520 L688 530 L698 530" class="file"/>
  <text x="620" y="540" class="n">lex_fts</text>
  <text x="620" y="556" class="s m">fts5 bm25</text>
  <path d="M726 520 L818 520 L828 530 L828 566 L726 566 Z M818 520 L818 530 L828 530" class="file"/>
  <text x="736" y="540" class="n">lex_trigram</text>
  <text x="736" y="556" class="s m">fts5 trigram</text>
  <path d="M856 520 L948 520 L958 530 L958 566 L856 566 Z M948 520 L948 530 L958 530" class="file"/>
  <text x="866" y="540" class="n">vec_dense</text>
  <text x="866" y="556" class="s m">vec0 knn</text>
  <path d="M986 520 L1044 520 L1054 530 L1054 566 L986 566 Z M1044 520 L1044 530 L1054 530" class="file"/>
  <text x="996" y="540" class="n">kg_edges</text>
  <text x="996" y="556" class="s m">cooccurs</text>

  <!-- reads (faint, table -> stage) -->
  <path d="M400 520 V330 H519 V302" class="fedge"/>
  <path d="M531 520 V446 H680 V416" class="fedge"/>
  <path d="M654 520 V416" class="fedge"/>
  <path d="M777 520 V416" class="fedge"/>
  <path d="M907 520 V446 H800 V416" class="fedge"/>
  <path d="M1020 520 V432 H1162 V308" class="fedge"/>
</svg>
