<style>
/* stemma eval report — zicato design language, standalone.
 * Theme and typeface tokens are COPIED from ui/static/ui.css (not imported)
 * so a report file stays self-contained forever. Sixteen terminal-derived
 * themes over fixed semantic roles; sans for prose and controls, mono
 * reserved for data; hairlines, not shadows; one accent, earned; good/bad
 * by direction, never identity; categorical color rides as small interior
 * dots, colored text, or chips — never a colored left rail.
 * No hex outside the theme blocks. */

/* ============ typefaces ============
 * The 12-face picker carried over from the sibling systems: three groups of
 * four. Default is T9 (sans for prose/controls, mono reserved for data);
 * the brand wordmark pins to a FIXED mono regardless of the picker. */
:root {
  --brand-mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: "Source Sans 3", system-ui, sans-serif;
  --mono: "Source Code Pro", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --font-head: "Source Sans 3", system-ui, sans-serif;
  --fs: 1;
}
/* Technical */
:root[data-type="T7"] {
  --sans: "Google Sans Mono", "Noto Sans Mono", ui-monospace, monospace;
  --mono: "Google Sans Mono", "Noto Sans Mono", ui-monospace, monospace;
  --font-head: "Google Sans Mono", "Noto Sans Mono", ui-monospace, monospace;
}
:root[data-type="T9"] {
  --sans: "Source Sans 3", system-ui, sans-serif;
  --mono: "Source Code Pro", ui-monospace, monospace;
  --font-head: "Source Sans 3", system-ui, sans-serif;
}
:root[data-type="T12"] {
  --sans: "Inconsolata", ui-monospace, monospace;
  --mono: "Inconsolata", ui-monospace, monospace;
  --font-head: "Inconsolata", ui-monospace, monospace;
}
:root[data-type="T14"] {
  --sans: "Ubuntu", system-ui, sans-serif;
  --mono: "Ubuntu Mono", ui-monospace, monospace;
  --font-head: "Ubuntu", system-ui, sans-serif;
}
/* Editorial */
:root[data-type="E5"] {
  --sans: "Fraunces", Georgia, serif; --mono: "Fraunces", Georgia, serif;
  --font-head: "Fraunces", Georgia, serif;
}
:root[data-type="E7"] {
  --sans: "Bitter", Georgia, serif; --mono: "Bitter", Georgia, serif;
  --font-head: "Bitter", Georgia, serif;
}
:root[data-type="E8"] {
  --sans: "Literata", Georgia, serif; --mono: "Literata", Georgia, serif;
  --font-head: "Literata", Georgia, serif;
}
:root[data-type="E15"] {
  --sans: "Domine", Georgia, serif; --mono: "Domine", Georgia, serif;
  --font-head: "Domine", Georgia, serif;
}
/* Display */
:root[data-type="D2"] {
  --sans: "Space Grotesk", system-ui, sans-serif; --mono: "Space Grotesk", system-ui, sans-serif;
  --font-head: "Archivo Narrow", "Space Grotesk", system-ui, sans-serif;
}
:root[data-type="D12"] {
  --sans: "Hanken Grotesk", system-ui, sans-serif; --mono: "Hanken Grotesk", system-ui, sans-serif;
  --font-head: "Hanken Grotesk", system-ui, sans-serif;
}
:root[data-type="D14"] {
  --sans: "Space Grotesk", system-ui, sans-serif; --mono: "Space Grotesk", system-ui, sans-serif;
  --font-head: "Barlow Condensed", "Archivo Narrow", system-ui, sans-serif;
}
:root[data-type="D5"] {
  --sans: "Bricolage Grotesque", system-ui, sans-serif; --mono: "Bricolage Grotesque", system-ui, sans-serif;
  --font-head: "Bricolage Grotesque", system-ui, sans-serif;
}

/* ============ base ============ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: calc(13px * var(--fs)); line-height: 1.5;
  transition: background .18s ease, color .18s ease;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--flat) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--flat); border-radius: 5px;
  border: 2px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.mono { font-family: var(--mono); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.faint { color: var(--ink-faint); }
a { color: var(--accent); text-decoration: none; }

/* ============ component vocabulary (from the console) ============ */
.panel {
  background: var(--panel); border: 1px solid var(--rule); border-radius: 4px;
  padding: 17px 19px; max-width: 100%; overflow-x: hidden;
}
.subhead {
  font-family: var(--mono); font-size: calc(10px * var(--fs));
  text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
  color: var(--ink-faint); margin: 0 0 8px;
}
.h1 { font-family: var(--font-head); font-size: calc(19px * var(--fs)); font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
.h2 {
  font-family: var(--font-head); font-size: calc(13px * var(--fs)); font-weight: 600;
  letter-spacing: .01em; margin: 0 0 10px;
  border-bottom: 1px solid var(--rule); padding-bottom: 6px;
}
.lede { font-size: calc(12.5px * var(--fs)); line-height: 1.45; max-width: 78ch; color: var(--ink-soft); }
.section { margin: 30px 0; }
.empty { color: var(--ink-faint); font-size: calc(12px * var(--fs)); font-style: italic; padding: 10px 0; }

.kv { display: grid; grid-template-columns: minmax(120px, 180px) minmax(0, 1fr); gap: 4px 14px; }
.kv .k {
  font-family: var(--mono); font-size: calc(10px * var(--fs)); text-transform: uppercase;
  letter-spacing: .05em; color: var(--ink-faint); padding-top: 2px;
}
.kv .v { font-family: var(--mono); font-size: calc(12px * var(--fs)); overflow-wrap: anywhere; }

.table-scroll { max-width: 100%; overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; font-size: calc(12px * var(--fs)); margin: 4px 0 12px; }
table.grid th, table.grid td { border: 1px solid var(--rule); padding: 5px 9px; text-align: left; color: var(--ink); }
table.grid th { background: var(--rule-soft); font-weight: 600; color: var(--ink-soft); }
table.grid td { font-family: var(--mono); font-size: calc(11.5px * var(--fs)); }

.pill {
  display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono);
  font-size: calc(10.5px * var(--fs)); padding: 2px 8px; border-radius: 10px; border: 1px solid;
}
.pill.good { color: var(--good); border-color: var(--good); background: var(--good-soft); }
.pill.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.pill.caution { color: var(--caution); border-color: var(--caution); }
.pill.neutral { color: var(--ink-soft); border-color: var(--rule); }
.chip {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs)); padding: 1px 6px;
  border-radius: 8px; border: 1px solid var(--rule); color: var(--ink-soft);
  text-transform: lowercase; white-space: nowrap;
  background: transparent; appearance: none;
}
button.chip { cursor: pointer; }
button.chip:hover { background: var(--rule-soft); color: var(--ink); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--flat); }
.dot.good { background: var(--good); }
.dot.bad { background: var(--bad); }
.dot.caution { background: var(--caution); }

/* ============ chrome: topbar + pickers (console idiom) ============ */
.topbar {
  position: sticky; top: 0; z-index: 6;
  display: flex; align-items: center; gap: 18px;
  padding: 11px 26px;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); }
.brand-word {
  font-family: var(--brand-mono); font-weight: 700; font-size: calc(15px * var(--fs));
  letter-spacing: .01em; color: var(--ink);
}
.brand-variant {
  font-family: var(--brand-mono); font-size: calc(9.5px * var(--fs));
  text-transform: uppercase; letter-spacing: .16em; color: var(--accent);
}
.crumbs { font-family: var(--mono); font-size: calc(11px * var(--fs)); color: var(--ink-faint); }
.spacer { flex: 1; }

.cd { position: relative; display: inline-flex; }
.cd-trigger {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--rule); border-radius: 5px;
  padding: 3px 8px;
  background: transparent; color: var(--ink-soft); cursor: pointer;
  font-family: var(--sans);
  font-size: calc(11px * var(--fs));
  transition: border-color .15s, color .15s;
}
.cd-trigger:hover { color: var(--ink); border-color: var(--accent); }
.cd-name { color: var(--ink); white-space: nowrap; }
.cd-caret { color: var(--ink-faint); font-size: calc(8px * var(--fs)); transition: transform .15s; }
.cd.open .cd-caret { transform: rotate(180deg); }
.swatch-strip {
  display: inline-flex; flex: none;
  border: 1px solid var(--rule); border-radius: 3px; overflow: hidden;
}
.swatch-strip i { display: inline-block; width: 10px; height: 10px; }
.swatch-strip i + i { border-left: 1px solid var(--rule); }
.cd-list {
  display: none; position: absolute; top: calc(100% + 5px); right: 0; z-index: 30;
  min-width: 192px; max-height: 60vh; overflow-y: auto;
  padding: 4px; border-radius: 5px;
  background: var(--panel); border: 1px solid var(--rule);
}
.cd.open > .cd-list { display: block; }
.cd-option {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 7px; border-radius: 4px; cursor: pointer;
  color: var(--ink-soft); transition: background .12s, color .12s;
}
.cd-option:hover { background: var(--rule-soft); color: var(--ink); }
.cd-option[aria-selected="true"] .cd-name { color: var(--accent); }

.tf-pop {
  display: none; flex-direction: column;
  position: absolute; top: calc(100% + 5px); right: 0; z-index: 30;
  min-width: 252px; padding: 4px; border-radius: 5px;
  background: var(--panel); border: 1px solid var(--rule);
}
.cd.open > .tf-pop { display: flex; }
.tf-list { overflow-y: auto; max-height: 56vh; }
.tf-group { padding: 7px 7px 3px; border-top: 1px solid var(--rule-soft); margin-top: 3px; }
.tf-group:first-child { border-top: none; margin-top: 0; }
.tf-group .subhead { margin: 0; }
.tf-option {
  display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  padding: 5px 7px; border-radius: 4px; cursor: pointer; transition: background .12s;
}
.tf-option:hover { background: var(--rule-soft); }
.tf-name { font-size: calc(13px * var(--fs)); line-height: 1.3; color: var(--ink); white-space: nowrap; }
.tf-option[aria-selected="true"] .tf-name { color: var(--accent); }
.tf-sample { font-size: calc(10.5px * var(--fs)); line-height: 1.3; color: var(--ink-faint); white-space: nowrap; }
.tf-spec { font-size: calc(12px * var(--fs)); line-height: 1; color: var(--ink-soft); }
.tf-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-top: 4px; padding: 6px 4px 3px; border-top: 1px solid var(--rule-soft);
}
.tf-foot .k {
  font-family: var(--mono); font-size: calc(10px * var(--fs)); text-transform: uppercase;
  letter-spacing: .05em; color: var(--ink-faint);
}
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; }
.seg button {
  border: none; background: transparent; color: var(--ink-soft); cursor: pointer;
  font-family: var(--mono); font-size: calc(10.5px * var(--fs)); padding: 2px 9px;
}
.seg button + button { border-left: 1px solid var(--rule); }
.seg button.on { color: var(--accent); font-weight: 700; }

/* ============ report layout ============ */
.page { max-width: 1200px; margin: 0 auto; padding: 34px 30px 110px; }
.runhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }

/* the mechanism × tier matrix */
table.matrix td { padding: 0; }
.cellbox {
  display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
  width: 100%; padding: 7px 10px; border: none; background: transparent;
  font-family: var(--mono); color: var(--ink); cursor: pointer; text-align: left;
}
.cellbox:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.cellbox.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.cell-r5 { font-size: calc(14px * var(--fs)); font-weight: 600; font-variant-numeric: tabular-nums; }
.cell-delta { font-size: calc(10px * var(--fs)); font-variant-numeric: tabular-nums; color: var(--ink-faint); }
.cell-delta.up { color: var(--good); }
.cell-delta.down { color: var(--bad); }
.cell-ci { font-size: calc(9.5px * var(--fs)); color: var(--ink-faint); font-variant-numeric: tabular-nums; }

/* per-cell drawer */
.drawer { margin: 10px 0 16px; }
.drawer table.grid td.q { font-family: var(--sans); max-width: 46ch; overflow-wrap: anywhere; }

/* score-conditioned accuracy */
.calgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.calcard svg { display: block; width: 100%; height: auto; }
.callabel { font-family: var(--mono); font-size: calc(10.5px * var(--fs)); color: var(--ink-soft); margin-top: 4px; }
